services:
  db:
    image: postgres:16
    container_name: pgqueue-db
    environment:
      POSTGRES_USER: pgqueue
      POSTGRES_PASSWORD: pgqueue
      POSTGRES_DB: pgqueue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../spec/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgqueue -d pgqueue"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
